[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "treestack"
version = "0.1.0"
description = "Structural certificates for stacking configurations on trees"
requires-python = ">=3.9"
dependencies = ["networkx>=3.2,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]



[tool.setuptools.packages.find]
include = ["treestack*"]
