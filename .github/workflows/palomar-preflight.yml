name: Palomar Preflight

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  palomar-preflight:
    uses: PalomarRegistry/PalomarSubmission/.github/workflows/submission.yml@a09f5c38ee58bf92c459b974b174ff4063ebea5f
    with:
      repository: ${{ github.repository }}
      commit: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      pipeline_commit: a09f5c38ee58bf92c459b974b174ff4063ebea5f
      request_id: treestackchk
      mode: full
      execution_profile: palomar-standard-v1
      execution_profile: palomar-standard-v1
      options: '{"comparator_config_path":"comparator.json","authorization_relationship":"I am a responsible author or maintainer"}'
