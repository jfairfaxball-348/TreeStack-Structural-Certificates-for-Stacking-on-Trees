name: Paper build and arXiv preflight

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paper:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX Live and PDF inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended lmodern poppler-utils
      - name: Compile canonical source and extracted arXiv bundle
        run: python3 paper/build.py
      - name: Preserve inspection PDF and preflight results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TreeStack-paper
          path: |
            paper/TreeStack.pdf
            paper/arxiv/TreeStack-arxiv.tar.gz
            paper/.build/preflight.json
            paper/.build/local/main.log
            paper/.build/local/main.txt
          if-no-files-found: warn
          include-hidden-files: true
