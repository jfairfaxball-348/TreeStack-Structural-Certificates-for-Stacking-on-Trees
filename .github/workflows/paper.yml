name: Paper build and arXiv preflight

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  paper:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
      - name: Install TeX Live and PDF inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended lmodern poppler-utils
      - name: Compile canonical source and extracted arXiv bundle
        run: python3 paper/build.py
      - name: Commit rebuilt publication artifacts
        if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper/TreeStack.pdf paper/arxiv/TreeStack-arxiv.tar.gz
          if git diff --cached --quiet; then
            echo "Generated publication artifacts are already current."
          else
            git commit -m "Rebuild final publication artifacts"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - name: Preserve inspection PDF and preflight results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TreeStack-paper
          path: |
            paper/TreeStack.pdf
            paper/arxiv/TreeStack-arxiv.tar.gz
            paper/.build/preflight.json
            paper/.build/local/main.log
            paper/.build/local/main.txt
          if-no-files-found: warn
          include-hidden-files: true
